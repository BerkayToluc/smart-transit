name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Sözdizimi kontrolü
        run: python -m compileall -q -x 'node_modules|frontend' .

      - name: Ruff (yalnızca gerçek hata kuralları)
        run: ruff check --select E9,F63,F7,F82 --exclude frontend .

      - name: Testler
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "tests/ klasörü henüz yok, pytest atlandı"
          fi

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Lint (şimdilik bilgi amaçlı)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-dummy-key
          NEXT_TELEMETRY_DISABLED: "1"
